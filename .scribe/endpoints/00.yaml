name: Autenticación
description: |-

  Inicio y cierre de sesión, emisión de tokens Sanctum y administración de contraseñas.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/login
    metadata:
      custom: []
      groupName: Autenticación
      groupDescription: |-

        Inicio y cierre de sesión, emisión de tokens Sanctum y administración de contraseñas.
      subgroup: ''
      subgroupDescription: ''
      title: 'Iniciar sesión'
      description: |-
        Valida las credenciales, registra el intento de acceso y devuelve un token personal de Sanctum.
        El token queda limitado a las habilidades asignadas al usuario y debe enviarse como
        `Authorization: Bearer {token}` en los endpoints protegidos.

        Tras alcanzar el límite configurado de intentos fallidos, la cuenta queda bloqueada.
        Un inicio de sesión exitoso reinicia el contador de intentos y revoca los tokens previos.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      email:
        custom: []
        name: email
        description: 'Correo electrónico registrado del usuario.'
        required: true
        example: usuario@occumaster.test
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      password:
        custom: []
        name: password
        description: 'Contraseña del usuario.'
        required: true
        example: password123
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      email: usuario@occumaster.test
      password: password123
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "success": true,
            "message": "Authorization complete.",
            "token": "1|token-personal-de-sanctum",
            "abilities": ["read.patients", "create.medical_dates"],
            "user": {
              "name": "María Pérez",
              "email": "usuario@occumaster.test",
              "roles": ["doctor"]
            }
          }
        headers: []
        description: 'Acceso concedido'
      -
        custom: []
        status: 401
        content: |-
          {
            "success": false,
            "message": "Unauthorized"
          }
        headers: []
        description: 'Usuario inexistente o credenciales inválidas'
      -
        custom: []
        status: 403
        content: |-
          {
            "success": false,
            "message": "Account is blocked due to too many failed login attempts."
          }
        headers: []
        description: 'Cuenta bloqueada'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: 'api/change_password/{user_id}'
    metadata:
      custom: []
      groupName: Autenticación
      groupDescription: |-

        Inicio y cierre de sesión, emisión de tokens Sanctum y administración de contraseñas.
      subgroup: ''
      subgroupDescription: ''
      title: 'Restablecer la contraseña de un usuario'
      description: |-
        Permite a un usuario con la habilidad `update.users` establecer una nueva contraseña
        para el usuario indicado. No requiere la contraseña actual del usuario destino.
      authenticated: true
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      user_id:
        custom: []
        name: user_id
        description: 'The ID of the user.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      user:
        custom: []
        name: user
        description: 'ID del usuario al que se le cambiará la contraseña.'
        required: true
        example: 12
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      user_id: 1
      user: 12
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      new_password:
        custom: []
        name: new_password
        description: 'Nueva contraseña, mínimo 8 caracteres.'
        required: true
        example: nuevaPassword123
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      new_password_confirmation:
        custom: []
        name: new_password_confirmation
        description: 'Confirmación idéntica de la nueva contraseña.'
        required: true
        example: nuevaPassword123
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      new_password: nuevaPassword123
      new_password_confirmation: nuevaPassword123
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "message": "Password changed successfully."
          }
        headers: []
        description: ''
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: api/logout
    metadata:
      custom: []
      groupName: Autenticación
      groupDescription: |-

        Inicio y cierre de sesión, emisión de tokens Sanctum y administración de contraseñas.
      subgroup: ''
      subgroupDescription: ''
      title: 'Cerrar sesión'
      description: 'Revoca todos los tokens personales activos del usuario autenticado.'
      authenticated: true
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "message": "Logged out successfully."
          }
        headers: []
        description: ''
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: api/change_password
    metadata:
      custom: []
      groupName: Autenticación
      groupDescription: |-

        Inicio y cierre de sesión, emisión de tokens Sanctum y administración de contraseñas.
      subgroup: ''
      subgroupDescription: ''
      title: 'Cambiar mi contraseña'
      description: 'Cambia la contraseña del usuario autenticado. La nueva contraseña debe confirmarse.'
      authenticated: true
